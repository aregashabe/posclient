<h2>Delivery list</h2>

<a
routerLink="/addDelivery"
class="btn btn-success mb-3"

>

Add + </a>

<table
  mat-table
  [dataSource]="dataSource"
  matSort
  class="mat-elevation-z8"
>

  <!-- Delivery Name -->

  <ng-container matColumnDef="deliveryName">

```
<th
  mat-header-cell
  *matHeaderCellDef
  mat-sort-header
>
  Name
</th>

<td
  mat-cell
  *matCellDef="let row"
>
  {{ row.deliveryName }}
</td>
```

  </ng-container>

  <!-- Delivery Mobile -->

  <ng-container matColumnDef="deliveryMobile">

```
<th
  mat-header-cell
  *matHeaderCellDef
  mat-sort-header
>
  Mobile Number
</th>

<td
  mat-cell
  *matCellDef="let row"
>
  {{ row.deliveryMobile }}
</td>
```

  </ng-container>

  <!-- Actions -->

  <ng-container matColumnDef="actions">

```
<th
  mat-header-cell
  *matHeaderCellDef
>
  Actions
</th>

<td
  mat-cell
  *matCellDef="let row"
>

  <button
    type="button"
    class="btn btn-primary btn-sm me-2"
  >
    Edit
  </button>

  <button
    type="button"
    class="btn btn-danger btn-sm"
  >
    Delete
  </button>

</td>
```

  </ng-container>

  <!-- Header -->

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns"
  ></tr>

  <!-- Rows -->

  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;"
  ></tr>

</table>

<mat-paginator
[pageSizeOptions]="[10, 25, 50]"
showFirstLastButtons> </mat-paginator>
