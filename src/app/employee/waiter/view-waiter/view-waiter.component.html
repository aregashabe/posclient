<h2>Waiter list</h2>

<a
  routerLink="/addWaiter"
  class="btn btn-success"
>
  Add +
</a>

<table
  mat-table
  [dataSource]="dataSource"
  matSort
  class="mat-elevation-z8"
>

  <!-- Name -->
  <ng-container matColumnDef="name">

    <th
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
    >
      Name
    </th>

    <td
      mat-cell
      *matCellDef="let row"
    >
      {{ row.name }}
    </td>

  </ng-container>


  <!-- Designation -->
  <ng-container matColumnDef="designation">

    <th
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
    >
      Designation
    </th>

    <td
      mat-cell
      *matCellDef="let row"
    >
      {{ row.designation }}
    </td>

  </ng-container>


  <!-- Mobile Number -->
  <ng-container matColumnDef="mobileNumber">

    <th
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
    >
      Mobile Number
    </th>

    <td
      mat-cell
      *matCellDef="let row"
    >
      {{ row.mobileNumber }}
    </td>

  </ng-container>


  <!-- Description -->
  <ng-container matColumnDef="description">

    <th
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
    >
      Description
    </th>

    <td
      mat-cell
      *matCellDef="let row"
    >
      {{ row.description }}
    </td>

  </ng-container>


  <!-- Actions -->
  <ng-container matColumnDef="actions">

    <th
      mat-header-cell
      *matHeaderCellDef
    >
      Actions
    </th>

    <td
      mat-cell
      *matCellDef="let row"
    >

      <button
        type="button"
        class="btn btn-primary btn-sm"
      >
        Edit
      </button>

      <button
        type="button"
        class="btn btn-danger btn-sm"
      >
        Delete
      </button>

    </td>

  </ng-container>


  <!-- Header -->
  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns"
  ></tr>


  <!-- Rows -->
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;"
  ></tr>

</table>


<mat-paginator
  [pageSizeOptions]="[10, 25, 50]"
  showFirstLastButtons>
</mat-paginator>
