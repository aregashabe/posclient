<div class="container-fluid mt-4">

  <div class="row">

    <!-- FOOD MENU -->
    <div class="col-md-8">

      <div class="card shadow">

        <div class="card-header">
          <h4 class="mb-0">Select Food</h4>
        </div>

        <div class="card-body">

          <div class="row">

            <div
              class="col-md-4 mb-3"
              *ngFor="let foodmenu of dataSource.data"
            >

              <div class="card h-100 shadow-sm">

                <div class="card-body">

                  <h5 class="card-title">
                    {{ foodmenu.foodmenuName }}
                  </h5>

                  <p class="card-text">
                    {{ foodmenu.description }}
                  </p>

                  <h6>
                    {{ foodmenu.salesPrice }} ETB
                  </h6>

                  <button
                    type="button"
                    class="btn btn-success w-100 mt-2"
                    (click)="addToOrder(foodmenu)"
                  >
                    Add
                  </button>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- CURRENT ORDER -->
    <div class="col-md-4">

      <div class="card shadow">

        <div class="card-header">
          <h4 class="mb-0">
            Current Order
          </h4>
        </div>

        <div class="card-body">

          <!-- NO ITEMS -->
          <div *ngIf="orderItems.length === 0">

            <p class="text-muted">
              No items selected
            </p>

          </div>


          <!-- SELECTED ITEMS -->
          <div
            *ngFor="let item of orderItems"
            class="mb-3"
          >

            <div class="d-flex justify-content-between">

              <div>

                <strong>
                  {{ item.foodmenuName }}
                </strong>

                <br>

                <small class="text-muted">
                  {{ item.salesPrice }} ETB × {{ item.quantity }}
                </small>

              </div>

              <strong>
                {{ item.salesPrice * item.quantity }} ETB
              </strong>

            </div>

          </div>


          <hr>


          <!-- TOTAL -->
          <div class="d-flex justify-content-between">

            <strong>
              Total:
            </strong>

            <strong>
              {{ getTotal() }} ETB
            </strong>

          </div>


          <!-- SAVE ORDER -->
          <button
            type="button"
            class="btn btn-primary w-100 mt-3"
            [disabled]="orderItems.length === 0"
            (click)="saveOrder()"
          >
            Save Order
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
