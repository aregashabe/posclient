
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

  <!-- Email -->
  <div>
    <label for="email">Email:</label>

    <input
      type="email"
      id="email"
      formControlName="email"
    >
  </div>


  <!-- Password -->
  <div>

    <label for="password">Password:</label>

    <div
      style="
        position: relative;
        width: 100%;
      "
    >

      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        formControlName="password"
        style="
          width: 100%;
          box-sizing: border-box;
          padding-right: 45px;
        "
      >

      <!-- Eye INSIDE input -->
      <button
        type="button"
        (click)="togglePassword()"
        [attr.aria-label]="
          showPassword ? 'Hide password' : 'Show password'
        "
        style="
          position: absolute;
          right: 8px;
          top: 50%;
          transform: translateY(-50%);
          border: none;
          background: transparent;
          padding: 5px;
          margin: 0;
          cursor: pointer;
          font-size: 18px;
          z-index: 10;
        "
      >

        @if (showPassword) {
          🙈
        } @else {
          👁️
        }

      </button>

    </div>

  </div>


  <!-- Login -->
  <button
    type="submit"
    [disabled]="loginForm.invalid"
  >
    Login
  </button>

</form>
