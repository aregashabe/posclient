<div class="container mt-4">

  <h2 class="mb-4">User List</h2>
  <a routerLink="/add-user" class="btn btn-success" > Add + </a>

  <table
    mat-table
    [dataSource]="dataSource"
    matSort
    class="mat-elevation-z8 w-100"
  >

    <!-- ID -->
    <ng-container matColumnDef="id">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        ID
      </th>

      <td
        mat-cell
        *matCellDef="let user"
      >
        {{ user.id }}
      </td>

    </ng-container>


    <!-- First Name -->
    <ng-container matColumnDef="firstname">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        First Name
      </th>

      <td
        mat-cell
        *matCellDef="let user"
      >
        {{ user.firstname }}
      </td>

    </ng-container>


    <!-- Last Name -->
    <ng-container matColumnDef="lastname">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Last Name
      </th>

      <td
        mat-cell
        *matCellDef="let user"
      >
        {{ user.lastname }}
      </td>

    </ng-container>


    <!-- Email -->
    <ng-container matColumnDef="email">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Email
      </th>

      <td
        mat-cell
        *matCellDef="let user"
      >
        {{ user.email }}
      </td>

    </ng-container>


    <!-- Mobile -->
    <ng-container matColumnDef="mobile">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Mobile
      </th>

      <td
        mat-cell
        *matCellDef="let user"
      >
        {{ user.mobile }}
      </td>

    </ng-container>


    <!-- Role -->
    <ng-container matColumnDef="userRole">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Role
      </th>

      <td
        mat-cell
        *matCellDef="let user"
      >
        {{ user.userRole }}
      </td>

    </ng-container>


    <!-- Header -->
    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns"
    ></tr>


    <!-- Rows -->
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
    ></tr>

  </table>


  <!-- Pagination -->
  <mat-paginator
    [pageSizeOptions]="[5, 10, 25]"
    [pageSize]="5"
    showFirstLastButtons>
  </mat-paginator>

</div>
